<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#536650">
  <title>ShopWithEzz | Update in Progress</title>
  <style>
    :root{--green:#536650;--dark:#354134;--cream:#f4f1ea;--gold:#d7a83c}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--cream);color:var(--dark);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);background:#fff;border-radius:22px;padding:clamp(28px,7vw,60px);text-align:center;box-shadow:0 8px 25px rgba(53,65,52,.12);border-top:8px solid var(--green)}
    h1{margin:0;color:var(--green);font-size:clamp(34px,8vw,58px)}
    h2{margin:28px 0 14px;font-size:clamp(24px,5vw,34px)}
    p{font-size:18px;line-height:1.65;margin:14px 0}
    .notice{border:3px solid var(--gold);padding:18px;border-radius:14px;font-weight:700}
    footer{margin-top:30px;color:var(--green);font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>ShopWithEzz</h1>
    <h2>Update in progress</h2>
    <p class="notice">We are currently experiencing some issues while we finish and verify an important update.</p>
    <p>The download page is temporarily unavailable. Please check back soon.</p>
    <p>Thank you for your patience.</p>
    <footer>Team Lalli61<br>Last updated: 5 October 2026</footer>
  </main>
</body>
</html>
